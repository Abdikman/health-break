<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Health Break</title>
		<link rel="stylesheet" href="css/main.css">
		<link rel="stylesheet" href="css/timer.css">
		<link rel="stylesheet" href="css/catalog.css">
		<script type="module" src="js/main.js" defer></script>
	</head>
	<body>
		<!-- Навигация (меню) -->
		<nav class="sidebar">
			<div class="logo">HB</div>
			<button class="nav-btn active" data-tab="home">🏠 Главная</button>
			<button class="nav-btn" data-tab="catalog">📚 Каталог</button>
			<button class="nav-btn" data-tab="settings">⚙️ Настройки</button>
			<button id="test-notify-btn" style="margin-top: 10px">
				🔔 Тест уведомления
			</button>
		</nav>

		<main class="content">
			<!-- Вкладка: Главная (Таймер) -->
			<section id="home" class="tab-content active">
				<div class="home-center">
					<h1>Таймер здоровья</h1>
					<div class="timer-display">30:00</div>

				<div class="timer-controls">
					<button id="toggle-timer" class="power-btn">
						<svg
							viewBox="0 0 24 24"
							width="32"
							height="32"
							stroke="currentColor"
							stroke-width="2"
							fill="none"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
							<line x1="12" y1="2" x2="12" y2="12"></line>
						</svg>
					</button>
				</div>
			</section>

			<!-- Вкладка: Каталог -->
			<section id="catalog" class="tab-content">
				<div class="catalog-header">
					<h1>Каталог упражнений</h1>
					<button id="add-exercise-btn" class="add-exercise-btn">+ Добавить упражнение</button>
				</div>
				<div id="exercise-grid" class="exercise-grid">
					<!-- Карточки будут здесь -->
				</div>
			</section>

			<!-- Вкладка: Настройки -->
			<section id="settings" class="tab-content">
				<h1>Настройки</h1>
				<label>
					Время работы (мин):
					<input type="number" id="duration-input" value="30" />
				</label>
				<div class="settings-group">
					<h3>Звук уведомления</h3>
					<select id="sound-select"></select>
					<button id="open-sounds-btn">📂 Добавить свои звуки</button>
				</div>
			</section>
		</main>

		<!-- Модалка: просмотр упражнения -->
		<div id="exercise-modal" class="modal-overlay">
			<div class="modal-content">
				<button class="close-modal">&times;</button>
				<div class="modal-body">
					<h2 id="modal-title">Название</h2>
					<div id="modal-tags" class="modal-tags"></div>
					<div id="modal-media">
						<!-- Сюда JS вставит img -->
					</div>
					<div id="modal-video-container" class="modal-video-container">
						<video id="modal-video" controls></video>
					</div>
					<div id="modal-audio-container" class="modal-audio-container">
						<audio id="modal-audio" controls></audio>
					</div>
					<p id="modal-desc">Описание упражнения...</p>
					<div class="modal-footer">
						<button id="delete-exercise-btn" class="btn-delete">🗑 Удалить упражнение</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Модалка: добавление упражнения -->
		<div id="add-exercise-modal" class="modal-overlay">
			<div class="modal-content modal-content--form">
				<button class="close-modal" id="close-add-modal">&times;</button>
				<h2>Новое упражнение</h2>
				<form id="add-exercise-form">
					<div class="form-group">
						<label for="new-ex-title">Название *</label>
						<input type="text" id="new-ex-title" placeholder="Например: Разминка плеч" required>
					</div>
					<div class="form-group">
						<label for="new-ex-desc">Описание *</label>
						<textarea id="new-ex-desc" rows="4" placeholder="Опишите упражнение..." required></textarea>
					</div>
					<div class="form-group">
						<label>Категории</label>
						<div class="tag-checkboxes">
							<label class="tag-label"><input type="checkbox" name="tag" value="глаза"> Глаза</label>
							<label class="tag-label"><input type="checkbox" name="tag" value="шея"> Шея</label>
							<label class="tag-label"><input type="checkbox" name="tag" value="спина"> Спина</label>
							<label class="tag-label"><input type="checkbox" name="tag" value="кисти"> Кисти</label>
							<label class="tag-label"><input type="checkbox" name="tag" value="другое"> Другое</label>
						</div>
					</div>
					<div class="form-group">
						<label>Изображения</label>
						<button type="button" id="pick-images-btn" class="pick-file-btn">📂 Добавить изображения</button>
						<div id="image-preview-strip" class="image-preview-strip"></div>
					</div>
					<div class="form-group">
						<label>Медиа-сопровождение</label>
						<div class="media-pickers">
							<div class="file-picker-row">
								<span class="media-type-label">🔊 Аудио</span>
								<button type="button" id="pick-audio-btn" class="pick-file-btn">📂 Выбрать</button>
								<span id="audio-file-label" class="file-label">Не выбрано</span>
							</div>
							<div class="file-picker-row">
								<span class="media-type-label">🎬 Видео</span>
								<button type="button" id="pick-video-btn" class="pick-file-btn">📂 Выбрать</button>
								<span id="video-file-label" class="file-label">Не выбрано</span>
							</div>
						</div>
					</div>
					<div class="form-actions">
						<button type="button" id="cancel-add-exercise" class="btn-secondary">Отмена</button>
						<button type="submit" class="btn-primary">Сохранить</button>
					</div>
				</form>
			</div>
		</div>
	</body>
</html>
